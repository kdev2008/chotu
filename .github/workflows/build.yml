name: Build Chotu APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Add offline wake-word model (Vosk small Hindi)
        run: |
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          mkdir -p model_tmp app/src/main/assets
          unzip -q model.zip -d model_tmp
          rm -rf app/src/main/assets/model-hi
          mv model_tmp/*/ app/src/main/assets/model-hi
          echo "vosk-model-small-hi-0.22" > app/src/main/assets/model-hi/uuid
          ls app/src/main/assets/model-hi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chotu-apk
          path: app/build/outputs/apk/debug/app-debug.apk
